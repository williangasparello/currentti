# Supabase local config — Q7 Educação (independente do Lovable)
project_id = "q7-educacao"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Em desenvolvimento você pode desligar a confirmação por e-mail:
enable_confirmations = false

# --- Edge functions ---
# verify_jwt = true por padrão. Webhooks externos (sem sessão) usam false.
[functions.whatsapp-connect]
verify_jwt = true

[functions.send-message]
verify_jwt = true

[functions.ai-agent]
verify_jwt = true

[functions.whatsapp-webhook]
verify_jwt = false   # recebe chamadas externas da UaiZapi, sem sessão

[functions.n8n-webhook]
verify_jwt = false   # entrada externa de automação
