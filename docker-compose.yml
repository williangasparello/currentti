services:
  currentti:
    # Builda direto do repositório Git (funciona no "Compose a partir de URL" da Hostinger,
    # que busca só o docker-compose.yml). O commit é FIXADO para forçar rebuild ao atualizar
    # (o ref #main é cacheado pelo builder). Ao publicar mudanças, aponte para o novo commit.
    build: https://github.com/williangasparello/currentti.git#8c66183
    container_name: currentti
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - DB_PATH=/data/data.json
      # troque a senha do admin oficial em produção:
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-Q7admin2026}
    volumes:
      - currentti-data:/data

volumes:
  currentti-data:
